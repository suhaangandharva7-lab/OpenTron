<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTron // API Test Grid</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #f40082;
            --grid-color: rgba(0, 210, 255, 0.1);
            --bg-dark: #050b16;
            --glass: rgba(10, 25, 47, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Orbitron', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .button-grid {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            text-transform: uppercase;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        #status-area {
            margin-top: 20px;
            padding: 15px;
            border-left: 3px solid var(--neon-pink);
            background: rgba(244, 0, 130, 0.05);
            display: none;
        }

        .log {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #00ffcc;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 10px;
            text-transform: uppercase;
        }

        .processing { background: #ffcc00; color: #000; }
        .completed { background: #00cc66; color: #fff; }
        .failed { background: #ff3333; color: #fff; }

        .header-meta {
            text-align: right;
            font-size: 0.7rem;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-meta">GRID ACCESS // V1.0.4</div>
    <h1>OpenTron API Grid</h1>

    <div class="section">
        <label>Access Key (X-OPENTRON-KEY)</label>
        <input type="password" id="apiKey" placeholder="tron-xxxxxxxx">
    </div>

    <div class="section">
        <label>Neural Objective (Prompt)</label>
        <textarea id="prompt" rows="4" placeholder="Enter task for the operative..."></textarea>
    </div>

    <div class="section">
        <label>Review Policy</label>
        <select id="policy">
            <option value="NONE">NONE (Full Autonomy)</option>
            <option value="MEDIUM">MEDIUM (Balanced)</option>
            <option value="HIGH">HIGH (Co-pilot)</option>
        </select>
    </div>

    <div class="button-grid">
        <button onclick="executeTask()">Initiate Cycle</button>
        <button onclick="checkStatus()">Synchronize Status</button>
    </div>

    <div id="status-area">
        <h4 id="task-title">Current Cycle: <span id="task-id" style="color:#777">None</span> <span id="task-badge" class="status-badge"></span></h4>
        <div class="log" id="result-log">Waiting for neural link...</div>
    </div>
</div>

<script>
    let currentTaskId = null;
    let pollInterval = null;

    async function executeTask() {
        const apiKey = document.getElementById('apiKey').value;
        const prompt = document.getElementById('prompt').value;
        const policy = document.getElementById('policy').value;
        const log = document.getElementById('result-log');
        const badge = document.getElementById('task-badge');

        if (!apiKey || !prompt) {
            alert("❌ Grid Authentication or Objective missing.");
            return;
        }

        document.getElementById('status-area').style.display = 'block';
        log.innerText = "🚥 Initializing cycle submission...";
        badge.innerText = "QUEUED";
        badge.className = "status-badge processing";

        try {
            const response = await fetch('http://localhost:8000/v1/execute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-OPENTRON-KEY': apiKey
                },
                body: JSON.stringify({ prompt, policy })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || "Neural link failure.");
            }

            const data = await response.json();
            currentTaskId = data.task_id;
            document.getElementById('task-id').innerText = currentTaskId;
            log.innerText = `✅ Cycle Accepted. ID: ${currentTaskId}\nProcessing through the Grid...`;
            
            // Start Polling
            startPolling();
        } catch (error) {
            log.innerText = `❌ Error: ${error.message}`;
            badge.innerText = "FAILED";
            badge.className = "status-badge failed";
        }
    }

    async function checkStatus() {
        if (!currentTaskId) return;
        
        const apiKey = document.getElementById('apiKey').value;
        const log = document.getElementById('result-log');
        const badge = document.getElementById('task-badge');

        try {
            const response = await fetch(`http://localhost:8000/v1/task/${currentTaskId}`, {
                headers: { 'X-OPENTRON-KEY': apiKey }
            });

            const data = await response.json();
            badge.innerText = data.status.toUpperCase();
            
            if (data.status === 'completed') {
                log.innerText = "🌌 CYCLE COMPLETE\n\n" + data.result;
                badge.className = "status-badge completed";
                stopPolling();
            } else if (data.status === 'processing') {
                log.innerText = "⏳ Operative is currently interacting with the system...";
                badge.className = "status-badge processing";
            } else if (data.status === 'failed') {
                log.innerText = `❌ Grid Error: ${data.error}`;
                badge.className = "status-badge failed";
                stopPolling();
            }
        } catch (error) {
            console.error("Poll Error:", error);
        }
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(checkStatus, 3000);
    }

    function stopPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = null;
    }
</script>

</body>
</html>
